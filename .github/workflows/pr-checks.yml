name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job name is the required status check (branch protection points at "qa-gate").
  qa-gate:
    name: qa-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # only used to post the results comment
      issues: write # only used to open a bug when the gate blocks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate is enforcement code, so its own tests run first.
      - name: Gate unit tests
        run: node --test qa/gate/gate.test.mjs

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Never stop here: the gate must always run, and it fails closed if results are missing.
      - name: Run site tests
        continue-on-error: true
        run: npx playwright test -c qa/001-site-release-gate

      - name: Gate decision
        run: node qa/gate/gate.mjs --results test-results/results.json --mode pr --out gate-result.json

      - name: Build report
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f gate-result.json ]; then
            node qa/gate/report.mjs gate-result.json > report.md
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## QA gate: no result produced" | tee report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Same rule as the comment: forks get a read-only token, so skip them.
      - name: Open a bug if blocked
        if: failure() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash qa/gate/open-bug.sh "PR #${{ github.event.pull_request.number }}" report.md

      # Comments need a write token, which pull requests from forks do not get.
      - name: Post results on the pull request
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- qa-gate-report -->';
            const body = fs.readFileSync('report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Upload results, traces and gate decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: |
            test-results/
            gate-result.json
            report.md
          if-no-files-found: warn
          retention-days: 14
