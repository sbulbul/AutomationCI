name: Release pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # STUB: replaced by the real test run + gate in a later step.
  gate:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: echo "decision=PASS" >> "$GITHUB_OUTPUT"

  deploy-staging:
    needs: gate
    if: needs.gate.outputs.decision == 'PASS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish dist/ to the staging repo
        env:
          STAGING_DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: |
          git clone "https://x-access-token:${STAGING_DEPLOY_TOKEN}@github.com/sbulbul/AutomationCI-staging.git" staging
          cd staging
          git checkout -B main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Staging already up to date"
          else
            git commit -m "Deploy ${GITHUB_SHA} from AutomationCI"
            git push origin HEAD:main
          fi

  # Human approval: this job waits for a reviewer on the `production` environment.
  approve-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Approved for production (commit ${GITHUB_SHA})"

  deploy-live:
    needs: approve-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
